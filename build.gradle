plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = "vapeclient"
}

repositories {
	maven { url = "https://terraformersmc.com" }
	maven { url = "https://cafeteria.dev" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// This line tells Loom to build mappings directly from your 26.3 game file instead of checking external yarn servers!
	mappings loom.officialMojangMappings() 
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
