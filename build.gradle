plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = "vapeclient"
}

repositories {
	maven { url = "https://terraformersmc.com" }
	maven { url = "https://cafeteria.dev" } // Sodium Engine Hosting
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Automatically pulls yarn mappings targeting 26.3 parameters
	mappings "net.fabricmc:yarn:${project.minecraft_version}+build.1:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Dynamically hooks into the fabric_api_version variable from your file
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// High-performance Sodium dependency compiled for 26.3
	modImplementation "me.jellysquid.mods.sodium:sodium-fabric:mc26.3-0.6.0"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
