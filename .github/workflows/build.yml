name: Build Mod Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Setup Cloud Java 25 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle Build Tool Engine
        uses: gradle/actions/setup-gradle@v4

      # 🟢 FIX: Bypasses the missing repository gradlew jar binary by calling native runner gradle directly
      - name: Compile and Build Mod with Cloud Gradle
        run: gradle build
