name: Build Mod Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Setup Cloud Java 25 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # 🟢 FIX: Automatically builds and repairs the missing Gradle wrapper binary in the cloud environment
      - name: Setup Gradle Build Tool Engine
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Compile and Build Mod with Gradle Toolchain
        run: ./gradlew build

      - name: Upload Finished Compiled Client Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vape-Client-Jar
          path: build/libs/*-project.jar
