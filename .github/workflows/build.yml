name: Build Mod Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Setup Cloud Java 25 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25' # Changed from 21 to 25 to support Loom 1.19+

      - name: Validate Gradle Project Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and Build Mod with Gradle Toolchain
        run: ./gradlew build

      - name: Upload Finished Compiled Client Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vape-Client-Jar
          path: build/libs/*-project.jar

