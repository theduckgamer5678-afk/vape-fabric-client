name: Build Mod Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: gradle build

      - name: Dump Minecraft names
        if: always()
        run: |
          for j in $(find ~/.gradle -name "*.jar" -size +10M); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class"; then
              echo "JAR: $j"
              unzip -l "$j" | awk '{print $4}' | grep -E "GuiGraphics|screens/Screen\.class|KeyMapping|blaze3d/platform/(Window|InputConstants)|network/chat/Component\.class|client/Minecraft\.class" | head -40
              echo "--- Screen"
              javap -cp "$j" net.minecraft.client.gui.screens.Screen 2>&1 | grep -E "render|extract|mouseClicked|shouldPause|font|Background" | head -30
              echo "--- Window"
              javap -cp "$j" com.mojang.blaze3d.platform.Window 2>&1 | grep -iE "handle|window\(" | head -10
              echo "--- Minecraft"
              javap -cp "$j" net.minecraft.client.Minecraft 2>&1 | grep -E "getWindow|setScreen| screen|getInstance|player" | head -10
              break
            fi
          done
          echo "--- LWJGL"
          find ~/.gradle -name "lwjgl*glfw*" | head -5

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Vape-Client-Jar
          path: build/libs/*.jar
          if-no-files-found: error